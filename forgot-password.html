<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VaTViT | Reset Password</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root{ --gold:#FFD700; --gold-lt:#FFED4E; --black:#0A0E15; --surface:#0F1419; --surface2:#141A24; --white:#F4F1E8; --white-dim:#9AA0A8; --border:#1E2A38; --border-bright:#2A3848; --orange:#FF6B35; --green:#00FF88; }
    body{
      font-family: Calibri, sans-serif; color: var(--white);
      background: linear-gradient(135deg,#0a0e15,#111827 50%,#0f1419);
      min-height: 100vh; display: grid; place-items: center; padding: 24px;
    }
    .card{
      width: min(520px, 100%); background: rgba(15,20,25,.9); border:1px solid var(--border); border-radius:20px;
      box-shadow:0 30px 80px rgba(0,0,0,.35); overflow:hidden;
    }
    .header{ background: linear-gradient(135deg, rgba(255,215,0,.12), rgba(255,107,53,.12)); padding: 24px; border-bottom: 1px solid var(--border); }
    .chip{ display:inline-flex; align-items:center; gap:8px; font-size:.7rem; letter-spacing:.12em; text-transform:uppercase; color:var(--gold); font-weight:700; }
    .chip::before{ content:""; width:8px; height:8px; border-radius:50%; background:var(--gold); }
    h1{ margin-top: 14px; font-size: clamp(2rem, 5vw, 2.6rem); }
    .body{ padding: 24px; }
    label{ display:block; margin-bottom: 8px; color: var(--white-dim); font-size:.72rem; letter-spacing:.12em; text-transform:uppercase; }
    input{
      width:100%; padding: .9rem 1rem; border-radius: 10px; border:1px solid var(--border-bright); background: rgba(255,255,255,.02);
      color: var(--white); margin-bottom: 18px; outline:none;
    }
    input:focus{ border-color: rgba(255,215,0,.7); box-shadow: 0 0 0 3px rgba(255,215,0,.1); }
    .primary{ width:100%; border:0; border-radius:10px; background: linear-gradient(135deg,var(--gold),var(--orange)); color: var(--black); font-weight:800; font-size:1rem; padding: 0.95rem 1rem; cursor:pointer; }
    .link-row{ margin-top: 16px; display:flex; justify-content:space-between; align-items:center; gap: 12px; font-size:.85rem; color: var(--white-dim); }
    .link-row a{ color: var(--gold); }
  </style>
</head>
<body>
  <div class="card">
    <div class="header">
      <div class="chip">Secure reset</div>
      <h1>Reset your password</h1>
    </div>
    <div class="body">
      <form>
        <label for="email">Email address</label>
        <input id="email" type="email" placeholder="you@example.com">
        <button class="primary" type="submit">Send reset link</button>
      </form>
      <div class="link-row">
        <a href="auth.html">Back to sign in</a>
        <a href="index.html">Home</a>
      </div>
    </div>
  </div>
</body>
</html>
