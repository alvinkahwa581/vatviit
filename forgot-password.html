<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Password reset | VaTViT</title>
  <meta name="description" content="Get help accessing your VaTViT account.">
  <meta name="robots" content="noindex,follow">
  <link rel="canonical" href="https://vatvit.site/forgot-password.html">
  <link rel="stylesheet" href="assets/editorial-fonts.css">
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{--gold:#FFD700;--black:#0A0E15;--white:#F4F1E8;--muted:#9AA0A8;--border:#1E2A38;--green:#00FF88;--orange:#FF6B35}
    body{min-height:100vh;display:grid;place-items:center;padding:24px;color:var(--white);background:linear-gradient(135deg,#0a0e15,#111827 50%,#0f1419);font:16px/1.6 Calibri,Arial,sans-serif}
    main{width:min(520px,100%)}
    .card{background:rgba(15,20,25,.9);border:1px solid var(--border);border-radius:20px;box-shadow:0 30px 80px rgba(0,0,0,.35);overflow:hidden}
    .header{padding:24px;background:linear-gradient(135deg,rgba(255,215,0,.12),rgba(255,107,53,.12));border-bottom:1px solid var(--border)}
    .chip{display:inline-flex;align-items:center;gap:8px;color:var(--gold);font-size:.75rem;letter-spacing:.12em;text-transform:uppercase;font-weight:700}
    .chip::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--gold)}
    h1{margin-top:14px;font-size:clamp(2rem,5vw,2.6rem)}
    .content{padding:24px}
    p{margin-bottom:18px;color:var(--muted)}
    .notice{border-left:3px solid var(--green);padding:14px 16px;background:rgba(0,255,136,.07);color:var(--white)}
    .notice a,.links a{color:var(--gold);text-decoration:underline;text-underline-offset:3px}
    .links{display:flex;justify-content:space-between;gap:12px;margin-top:22px;font-size:.9rem}
  </style>
</head>
<body>
  <a class="skip-link" href="#main-content">Skip to main content</a>
  <main id="main-content" tabindex="-1" aria-labelledby="page-title">
    <article class="card">
      <header class="header">
        <div class="chip">Account help</div>
        <h1 id="page-title">Reset your password</h1>
      </header>
      <div class="content">
        <p class="notice" role="status">Automated password resets are not available yet. Contact VaTViT support at <a href="tel:0724862593">0724862593</a> for help accessing your account.</p>
        <nav class="links" aria-label="Account navigation">
          <a href="auth.html">Back to sign in</a>
          <a href="index.html">Home</a>
        </nav>
      </div>
    </article>
  </main>
</body>
</html>
