<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Email verification | VaTViT</title>
  <meta name="description" content="Email verification information for VaTViT accounts.">
  <meta name="robots" content="noindex,follow">
  <link rel="canonical" href="https://vatvit.site/verify-email.html">
  <link rel="stylesheet" href="assets/editorial-fonts.css">
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{--gold:#FFD700;--black:#0A0E15;--white:#F4F1E8;--muted:#9AA0A8;--border:#1E2A38;--green:#00FF88;--orange:#FF6B35}
    body{min-height:100vh;display:grid;place-items:center;padding:24px;color:var(--white);background:linear-gradient(135deg,#0a0e15,#111827 50%,#0f1419);font:16px/1.6 Calibri,Arial,sans-serif}
    main{width:min(560px,100%)}
    .card{background:rgba(15,20,25,.9);border:1px solid var(--border);border-radius:20px;box-shadow:0 30px 80px rgba(0,0,0,.35);overflow:hidden}
    .header{padding:24px;background:linear-gradient(135deg,rgba(0,255,136,.12),rgba(255,215,0,.12));border-bottom:1px solid var(--border)}
    .badge{display:inline-flex;align-items:center;gap:8px;color:var(--green);font-size:.75rem;letter-spacing:.12em;text-transform:uppercase;font-weight:700}
    .badge::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--green)}
    h1{margin-top:14px;font-size:clamp(2rem,5vw,2.8rem)}
    .content{padding:24px}
    p{margin-bottom:18px;color:var(--muted)}
    .actions{display:flex;flex-wrap:wrap;gap:12px;margin-top:20px}
    .actions a{flex:1;min-width:180px;padding:14px 16px;border-radius:10px;text-align:center;font-weight:700;text-decoration:none}
    .primary{background:linear-gradient(135deg,var(--gold),var(--orange));color:var(--black)}
    .secondary{border:1px solid var(--border);background:rgba(255,255,255,.02);color:var(--white)}
  </style>
</head>
<body>
  <a class="skip-link" href="#main-content">Skip to main content</a>
  <main id="main-content" tabindex="-1" aria-labelledby="page-title">
    <article class="card">
      <header class="header">
        <div class="badge">Verification</div>
        <h1 id="page-title">Check your email</h1>
      </header>
      <div class="content">
        <p role="status">If an email verification message was requested, check your inbox and spam folder. Email verification is not currently connected in this preview.</p>
        <nav class="actions" aria-label="Account navigation">
          <a class="primary" href="auth.html">Back to sign in</a>
          <a class="secondary" href="index.html">Home</a>
        </nav>
      </div>
    </article>
  </main>
</body>
</html>
