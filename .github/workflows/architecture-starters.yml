name: VaTViT architecture starters

on:
  push:
    paths:
      - "apps/mobile/**"
      - "services/perl-core/**"
      - "services/community-rails/**"
      - "integrations/**"
      - "docs/technology-stack.md"
      - ".github/workflows/architecture-starters.yml"
  pull_request:
    paths:
      - "apps/mobile/**"
      - "services/perl-core/**"
      - "services/community-rails/**"
      - "integrations/**"
      - "docs/technology-stack.md"
      - ".github/workflows/architecture-starters.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci --no-audit --no-fund
          else
            npm install --no-audit --no-fund
          fi
      - run: npm run typecheck
      - run: npx expo install --check
      - run: npm run build:android

  perl-core:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/perl-core
    steps:
      - uses: actions/checkout@v4
      - uses: shogo82148/actions-setup-perl@v1
        with:
          perl-version: "5.40"
      - name: Install Mojolicious
        run: cpanm --notest --installdeps .
      - name: Test Mojolicious service
        run: PERL5LIB=lib prove -lr t
      - name: Check app syntax
        run: perl -Ilib -c app.pl

  community-rails:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/community-rails
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
      - name: Install Rails dependencies
        run: bundle install
      - run: bundle exec rails test

  python-adapter:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: integrations/python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run standard-library tests
        env:
          PYTHONPATH: .
        run: python -m unittest discover -s tests -v
