name: VaTViT web pilot

on:
  push:
    paths:
      - "web-pilot/**"
      - ".github/workflows/web-pilot.yml"
  pull_request:
    paths:
      - "web-pilot/**"
      - ".github/workflows/web-pilot.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web-pilot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: vatvit-web-pilot-${{ github.sha }}
          path: web-pilot/dist/
          retention-days: 14
