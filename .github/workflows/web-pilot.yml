name: VaTViT web pilot

on:
  push:
    paths:
      - "web-pilot/**"
      - ".github/workflows/web-pilot.yml"
  pull_request:
    paths:
      - "web-pilot/**"
      - ".github/workflows/web-pilot.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web-pilot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
      - run: npm ci --no-audit --no-fund
      - run: npm run build:preview
      - name: Publish isolated preview files
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        working-directory: .
        run: |
          git add web-pilot-preview
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Publish VaTViT React pilot preview" -m "Co-authored-by: Copilot <223556219+Copilot@users.noreply.github.com>"
          git push
      - uses: actions/upload-artifact@v4
        with:
          name: vatvit-web-pilot-${{ github.sha }}
          path: web-pilot-preview/
          retention-days: 14
